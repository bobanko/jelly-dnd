<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Редактор — Jelly & Bones</title><link rel="stylesheet" href="editor.css"></head>
<body class="preview-mode">
<header class="topbar"><a class="brand" href="./"><span>✦</span> JELLY <i>&</i> BONES</a><span class="mode-label">МАСТЕРСКАЯ</span><input id="level-name" maxlength="80" aria-label="Название уровня"><span id="save-status" role="status">Сохранено</span><div class="actions"><button id="undo" title="Отменить (Ctrl+Z)" aria-label="Отменить">↶</button><button id="redo" title="Повторить (Ctrl+Y)" aria-label="Повторить">↷</button><span class="separator"></span><button id="import">Импорт</button><button id="export">Экспорт ↓</button><button id="play" class="primary">▶ Играть</button></div><input id="file" type="file" accept=".json,application/json" hidden></header>
<div class="workbench">
 <aside class="palette"><div class="panel-heading"><span>ПАЛИТРА</span></div><div class="basic-tools"><button data-tool="select" title="Выбрать (V)">↖ Выбрать</button><button data-tool="erase" title="Ластик (X)">⌫ Ластик</button></div><div id="palette"></div></aside>
 <main class="workspace"><div class="viewport-toolbar"><label class="height-control">Y <select id="brush-height" aria-label="Высота кисти"><option value="0">0 · пол</option><option value="1">1 · платформа</option><option value="2">2 · платформа</option><option value="3">3 · платформа</option></select></label><label id="shape-label"><select id="brush-shape" aria-label="Форма кисти"><option value="brush">Кисть</option><option value="rectangle">Прямоугольник</option></select></label><button id="fit" title="Вписать карту (F)">⊡ Вписать</button><div class="camera-buttons"><button id="rotate-left" aria-label="Повернуть влево">↶ 90°</button><button id="rotate-right" aria-label="Повернуть вправо">90° ↷</button></div><label class="connections"><input id="connections" type="checkbox" checked> Связи</label></div>
 <div id="viewport" tabindex="0" aria-label="Рабочая область редактора"><canvas id="preview" aria-label="Трёхмерный редактор уровня"></canvas><canvas id="spatial-overlay" aria-hidden="true"></canvas><div class="viewport-caption"><span id="view-caption">3D-РЕДАКТОР</span><span id="cell-info">X — / Z —</span></div><div id="gpu-message" hidden role="status"></div></div>
 <div class="viewport-footer"><span id="active-tool">Выбор</span><span id="mouse-hints">ЛКМ — кисть · Shift+ЛКМ — стереть · ПКМ / Q E — вращать · M / Space — сдвиг · WASD / ↑↓←→ — вид</span><span id="zoom-label">100%</span></div></main>
 <aside class="inspector"><section><div class="panel-heading"><span>КЛЕТКА</span><span id="selected-coords">—</span></div><div id="properties"><p class="empty-state">Выберите клетку на карте.</p></div></section><section class="map-settings"><div class="panel-heading"><span>УРОВЕНЬ</span></div><div id="stats"></div><div class="map-buttons"><button id="new">Новая карта</button><button id="original">Исходный уровень</button></div><button id="validate" class="validation-button">✓ Проверить уровень</button><div id="issues" role="status"></div></section></aside>
</div><div id="toast" role="status" hidden></div>
<script src="levels.js"></script><script src="editor-model.js"></script><script src="soft-body.js"></script><script src="level-features.js"></script><script src="combat.js"></script><script src="physics.js"></script><script src="webgpu-renderer.js"></script><script src="game-effects.js"></script><script src="editor-space.js"></script><script src="level-loader.js" data-entry="editor.js"></script>
