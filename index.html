<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Jelly & Bones — The Sunken Sanctum</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="controls.css" />
  </head>
  <body class="menu-open">
    <div id="loading-spinner" role="status" aria-label="loadingLevel">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <mask id="loading-gear-hole">
            <rect width="100" height="100" fill="white" />
            <circle cx="50" cy="50" r="15" fill="black" />
          </mask>
        </defs>
        <g fill="currentColor" mask="url(#loading-gear-hole)">
          <circle cx="50" cy="50" r="35" />
          <rect x="38" y="3" width="24" height="27" rx="3" />
          <rect x="38" y="3" width="24" height="27" rx="3" transform="rotate(60 50 50)" />
          <rect x="38" y="3" width="24" height="27" rx="3" transform="rotate(120 50 50)" />
          <rect x="38" y="3" width="24" height="27" rx="3" transform="rotate(180 50 50)" />
          <rect x="38" y="3" width="24" height="27" rx="3" transform="rotate(240 50 50)" />
          <rect x="38" y="3" width="24" height="27" rx="3" transform="rotate(300 50 50)" />
        </g>
      </svg>
    </div>
    <canvas id="scene" aria-label="Jelly & Bones"></canvas>
    <div class="game-tools">
      <button id="menu-button" class="icon-button" title="Menu" aria-label="Menu">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 6h16M4 12h16M4 18h16" />
        </svg></button
      ><span id="fps" aria-label="Frames per second">— FPS</span
      ><button
        id="sound"
        class="icon-button"
        title="Включить звук"
        aria-label="Включить звук"
        aria-pressed="false"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M11 5 6 9H3v6h3l5 4Z" />
          <path class="sound-on" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" />
          <path class="sound-off" d="m16 9 6 6m0-6-6 6" />
        </svg>
      </button>
    </div>
    <main>
      <div id="player-hints" aria-hidden="true"></div>
      <div id="status" class="sr-only" role="status" aria-live="polite"></div>
      <div id="win" hidden role="dialog" aria-modal="true" aria-labelledby="win-title">
        <div class="win-panel">
          <h2 id="win-title" data-t="levelComplete"></h2>
          <p id="win-level-name"></p>
          <p id="win-time"></p>
          <div id="win-deaths"></div>
          <nav class="menu-items">
            <button id="again" data-t="replay"></button
            ><button id="win-next" data-t="nextLevel"></button>
          </nav>
          <div class="win-hints controls-footer screen-controls">
            <span
              ><kbd>&uarr;</kbd> <kbd>&darr;</kbd> / <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd>
              <kbd>D</kbd> <span data-t="navigate"></span></span
            ><span><kbd>Enter</kbd> / <kbd>E</kbd> <span data-t="select"></span></span
            ><span><kbd>Esc</kbd> / <kbd>Q</kbd> <span data-t="helpMenu"></span></span>
          </div>
        </div>
      </div>
    </main>
    <details class="jelly-settings" hidden>
      <summary>
        <span data-t="developerSettings"></span
        ><svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m9 3-1 3-3 1-2 3 2 2-1 3 3 2 2-1 3 2 3-2v-3l3-2-1-3 2-2-2-3-3-1-1-3Z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
      </summary>
      <label
        >Мягкость<input id="softness" type="range" min="0" max="1" step=".05" value=".5" /></label
      ><label
        >Затухание<input id="decay" type="range" min="0" max="1" step=".05" value=".5" /></label
      ><label class="mesh-toggle"><input id="mesh" type="checkbox" /> Показать решётку</label
      ><label class="mesh-toggle"><input id="colliders" type="checkbox" /> Коллайдеры уровня</label>
      <fieldset class="camera-settings">
        <legend>Камера</legend>
        <div id="camera-mode" class="projection-options" role="radiogroup" aria-label="Проекция">
          <label
            ><input type="radio" name="game-camera-projection" value="ortho" /><span
              >Изометрическая</span
            ></label
          ><label
            ><input type="radio" name="game-camera-projection" value="perspective" checked /><span
              >Перспективная</span
            ></label
          >
        </div>
        <div class="camera-actions">
          <div class="camera-zoom">
            <button id="camera-zoom-out" aria-label="Уменьшить масштаб">−</button
            ><output id="camera-zoom-value">100%</output
            ><button id="camera-zoom-in" aria-label="Увеличить масштаб">+</button>
          </div>
          <div class="camera-turn">
            <button id="camera-turn-left" aria-label="Повернуть влево">↶ 45°</button
            ><button id="camera-turn-right" aria-label="Повернуть вправо">45° ↷</button>
          </div>
        </div>
        <label for="camera-pitch"
          >Наклон<input
            id="camera-pitch"
            type="range"
            min="20"
            max="85"
            step="1"
            value="55"
          /><output id="camera-pitch-value" for="camera-pitch">55°</output></label
        >
        <label for="camera-fov"
          >FOV<input id="camera-fov" type="range" min="25" max="85" step="1" value="45" /><output
            id="camera-fov-value"
            for="camera-fov"
            >45°</output
          ></label
        >
      </fieldset>
    </details>
    <footer class="controls-footer screen-controls">
      <div class="controls">
        <span><kbd>Q</kbd><kbd>E</kbd> Поворот</span><span><kbd>Z</kbd> Отменить</span
        ><span><kbd>R</kbd> Сначала</span>
      </div>
      <div class="moves"><b id="moves">00</b> ДВИЖЕНИЙ</div>
    </footer>
    <div id="restart-fade" hidden aria-hidden="true"></div>
    <section id="level-intro" hidden aria-labelledby="level-intro-title">
      <div class="level-intro-content">
        <h2 id="level-intro-title"></h2>
        <div id="level-loading" hidden role="status" aria-live="polite">
          <p id="loading-status"></p>
          <progress id="loading-progress" max="1" value="0"></progress
          ><button id="loading-retry" hidden onclick="location.reload()" data-t="retry"></button>
        </div>
      </div>
    </section>
    <section id="main-menu" aria-labelledby="menu-title">
      <div class="menu-panel">
        <h1 id="menu-title" aria-label="Jelly & Bones">
          <span class="jelly-word"
            ><span class="jelly-letter" style="color: #9ddd56">J</span
            ><span class="jelly-letter" style="color: #477bff">e</span
            ><span class="jelly-letter" style="color: #ef5346">l</span
            ><span class="jelly-letter" style="color: #bb70ef">l</span
            ><span class="jelly-letter" style="color: #9ddd56">y</span></span
          >
          <span>&</span><br />Bones
        </h1>
        <div id="menu-root">
          <nav class="menu-items" aria-label="Main menu">
            <button id="play" data-t="play"></button
            ><button id="show-levels" data-t="levels"></button
            ><button id="show-controls" data-t="how"></button
            ><button id="open-editor" data-t="editor"></button>
          </nav>
          <div class="languages" aria-label="Language">
            <button data-language="en" lang="en">English</button
            ><button data-language="ru" lang="ru">русский</button>
          </div>
        </div>
        <div id="menu-help" hidden>
          <h2 data-t="how"></h2>
          <p class="help-goal" data-t="helpGoal"></p>
          <div class="help-controls">
            <div class="help-control">
              <span data-t="helpMove"></span>
              <div class="help-keysets">
                <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></span
                ><span><kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd></span
                ><span><kbd>I</kbd><kbd>J</kbd><kbd>K</kbd><kbd>L</kbd></span
                ><span><kbd>T</kbd><kbd>F</kbd><kbd>G</kbd><kbd>H</kbd></span
                ><span><kbd>Num 8</kbd><kbd>4</kbd><kbd>5</kbd><kbd>6</kbd></span>
              </div>
            </div>
            <div class="help-control">
              <span data-t="helpRotate"></span><span><kbd>Q</kbd> <kbd>E</kbd></span>
            </div>
            <div class="help-control"><span data-t="helpRestart"></span><kbd>R</kbd></div>
            <div class="help-control"><span data-t="helpUndo"></span><kbd>Z</kbd></div>
            <div class="help-control"><span data-t="helpMenu"></span><kbd>Esc</kbd></div>
          </div>
          <p class="help-note" data-t="helpTogether"></p>
          <button id="menu-back" data-t="back"></button>
        </div>
        <div id="menu-levels" hidden>
          <h2 data-t="levels"></h2>
          <nav class="level-list" aria-label="Levels"></nav>
          <button id="levels-back" data-t="back"></button>
        </div>
        <div class="menu-key-hints controls-footer screen-controls">
          <span
            ><kbd>↑</kbd> <kbd>↓</kbd> / <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd>
            <span data-t="navigate"></span></span
          ><span><kbd>Enter</kbd> / <kbd>E</kbd> <span data-t="select"></span></span
          ><span><kbd>Esc</kbd> / <kbd>Q</kbd> <span data-t="back"></span></span
          ><small class="build-version" id="build-version">dev</small>
        </div>
      </div>
    </section>
    <script type="module" src="bootstrap.js" data-entry="game.js"></script>
  </body>
</html>
