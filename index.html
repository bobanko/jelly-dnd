<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Jelly & Bones — The Sunken Sanctum</title><link rel="stylesheet" href="style.css"></head>
<body class="menu-open"><canvas id="scene" aria-label="Jelly & Bones"></canvas>
<div class="game-tools"><button id="menu-button" class="icon-button" title="Menu" aria-label="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><span id="fps" aria-label="Frames per second">— FPS</span><button id="sound" class="icon-button" title="Включить звук" aria-label="Включить звук" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4Z"/><path class="sound-on" d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/><path class="sound-off" d="m16 9 6 6m0-6-6 6"/></svg></button></div>
<main>

<div id="player-hints" aria-hidden="true"></div>
<div id="status" class="sr-only" role="status" aria-live="polite"></div>
<div id="win" hidden role="dialog" aria-modal="true" aria-labelledby="win-title"><div class="win-panel"><h2 id="win-title" data-t="levelComplete"></h2><p id="win-level-name"></p><nav class="menu-items"><button id="win-next" data-t="nextLevel"></button><button id="again" data-t="replay"></button></nav><div class="win-hints">↑↓ / WASD <span>Enter / E</span></div></div></div></main>
<details class="jelly-settings" hidden><summary><span data-t="developerSettings"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-1 3-3 1-2 3 2 2-1 3 3 2 2-1 3 2 3-2v-3l3-2-1-3 2-2-2-3-3-1-1-3Z"/><circle cx="12" cy="12" r="3"/></svg></summary>
<label>Мягкость<input id="softness" type="range" min="0" max="1" step=".05" value=".5"></label><label>Затухание<input id="decay" type="range" min="0" max="1" step=".05" value=".5"></label><label class="mesh-toggle"><input id="mesh" type="checkbox"> Показать решётку</label><label class="mesh-toggle"><input id="colliders" type="checkbox"> Коллайдеры уровня</label>
<fieldset class="camera-settings"><legend>Камера</legend>
<label class="camera-mode-label" for="camera-mode">Проекция<select id="camera-mode"><option value="perspective" selected>Перспективная</option><option value="ortho">Изометрическая</option></select></label>
<label for="camera-pitch">Наклон<input id="camera-pitch" type="range" min="25" max="80" step="1" value="55"><output id="camera-pitch-value" for="camera-pitch">55°</output></label>
<label for="camera-fov">FOV<input id="camera-fov" type="range" min="25" max="85" step="1" value="45"><output id="camera-fov-value" for="camera-fov">45°</output></label>
</fieldset></details>
<footer><div class="controls"><span><kbd>Q</kbd><kbd>E</kbd> Поворот</span><span><kbd>Z</kbd> Отменить</span><span><kbd>R</kbd> Сначала</span></div><div class="moves"><b id="moves">00</b> ДВИЖЕНИЙ <span>•</span> <button id="reset">↻ Сбросить</button></div></footer>
<div id="restart-fade" hidden aria-hidden="true"></div>
<section id="level-intro" hidden aria-labelledby="level-intro-title"><div class="level-intro-content"><h2 id="level-intro-title"></h2><div id="level-loading" hidden role="status" aria-live="polite"><p id="loading-status"></p><progress id="loading-progress" max="1" value="0"></progress><button id="loading-retry" hidden onclick="location.reload()" data-t="retry"></button></div></div></section>
<section id="main-menu" aria-labelledby="menu-title"><div class="menu-panel">
<h1 id="menu-title" aria-label="Jelly & Bones"><span class="jelly-word"><span class="jelly-letter" style="color:#9ddd56">J</span><span class="jelly-letter" style="color:#477bff">e</span><span class="jelly-letter" style="color:#ef5346">l</span><span class="jelly-letter" style="color:#bb70ef">l</span><span class="jelly-letter" style="color:#9ddd56">y</span></span> <span>&</span><br>Bones</h1>
<div id="menu-root"><nav class="menu-items" aria-label="Main menu"><button id="play" data-t="play"></button><button id="show-levels" data-t="levels"></button><button id="show-controls" data-t="how"></button><button id="open-editor" data-t="editor"></button></nav>
<div class="languages" aria-label="Language"><button data-language="en" lang="en">English</button><button data-language="ru" lang="ru">русский</button></div></div>
<div id="menu-help" hidden><h2 data-t="how"></h2><p data-t="instructions"></p><p data-t="cameraHelp"></p><button id="menu-back" data-t="back"></button></div>
<div id="menu-levels" hidden><h2 data-t="levels"></h2><nav class="level-list" aria-label="Levels"></nav><button id="levels-back" data-t="back"></button></div>
<div class="menu-key-hints"><span><kbd>↑</kbd> <kbd>↓</kbd> / <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> <span data-t="navigate"></span></span><span><kbd>Enter</kbd> / <kbd>E</kbd> <span data-t="select"></span></span><span><kbd>Esc</kbd> / <kbd>Q</kbd> <span data-t="back"></span></span></div>
</div></section>
<script src="i18n.js"></script><script src="progression.js"></script><script src="levels.js"></script><script src="soft-body.js"></script><script src="level-features.js"></script><script src="combat.js"></script><script src="physics.js"></script><script src="webgpu-renderer.js"></script><script src="game-effects.js"></script><script src="shared-camera.js"></script><script src="menu-scene.js"></script><script src="level-loader.js" data-entry="game.js"></script></body></html>
